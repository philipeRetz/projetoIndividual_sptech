<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Política Fundamental</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/estilo.css">
  <script src="../js/sessao.js"></script>
</head>
<body class="login-page">

  <div class="login">
    <div class="container">
      <div class="card card-login">
        <img class="logo-login" src="../assets/coroa-louros.jpg" alt="Coroa de louros" width="554" height="554">

        <h2>Entrar</h2>
        <p class="subtitulo">Faça login para acessar sua dashboard.</p>

        <div class="formulario">
          <div class="campo">
            <span>E-mail</span>
            <input id="email_input" type="email" placeholder="nome@exemplo.com" autocomplete="email">
          </div>

          <div class="campo">
            <div class="campo-topo">
              <span>Senha</span>
            </div>
            <input id="senha_input" type="password" placeholder="********" autocomplete="current-password">
          </div>

          <button class="botao" type="button" onclick="entrar()">Entrar</button>
        </div>

        <hr class="divisor">

        <p class="login-footer">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        <p class="login-footer"><a href="index.html">Voltar ao início</a></p>
      </div>
    </div>
  </div>

</body>
</html>

 <script>
    // Envia o email e a senha para a API e guarda os dados na sessao.
    function entrar() {
      let email = email_input.value;
      let senha = senha_input.value;

      // Validação simples: os dois campos precisam estar preenchidos.
      if (email == "" || senha == "") {
        alert("Preencha todos os campos.");
        return;
      }

      // Chama a rota de login do backend.
      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha
        })
      }).then(function (resposta) {
        // Se o login deu certo, guarda os dados na sessão do navegador.
        if (resposta.ok) {
          resposta.json().then(function (json) {
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;

            // Depois de logar, vai para a dashboard.
            window.location = "dashboard.html";
          });
        } else {
          // Se deu erro, mostra a mensagem enviada pelo backend.
          resposta.text().then(function (texto) {
            alert(texto || "E-mail ou senha inválidos.");
          });
        }
      }).catch(function (erro) {
        console.log(erro);
        alert("Erro ao conectar com o servidor.");
      });
    }
  </script>
