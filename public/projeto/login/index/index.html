<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="login-page">

  <div class="login">
    <div class="container">
      <div class="card card-login">
        <img class="logo-login" src="../../pgHome/assets/coroa-louros.jpg" width="554" height="554">

        <h2>Entrar</h2>
        <p class="subtitulo">Faça login para continuar</p>

        <div class="formulario">
          <div class="campo">
            <span>E-mail</span>
            <input id="email_input" type="text" placeholder="nome@exemplo.com">
          </div>

          <div class="campo">
            <div class="campo-topo">
              <span>Senha</span>
              <a class="link-ajuda" href="#">Esqueceu a senha?</a>
            </div>
            <input id="senha_input" type="password" placeholder="********">
          </div>

          <button class="botao" type="button">Entrar</button>
        </div>

        <hr class="divisor">

        <p class="login-footer">
          Não tem uma conta? <a href="../../cadastro/index/index.html">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
