<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="cadastro-page">

  <div class="login">
    <div class="container">
      <div class="card card-cadastro">
        <img class="logo-login" src="../../pgHome/assets/coroa-louros.jpg" width="554" height="554">

        <h2>Criar Conta</h2>
        <p class="subtitulo">Preencha os dados abaixo para começar.</p>

        <div class="formulario">
          <div class="campo">
            <span>Nome completo</span>
            <input id="nome_input" type="text" placeholder="Digite seu nome">
          </div>

          <div class="campo">
            <span>E-mail</span>
            <input id="email_input" type="text" placeholder="seuemail@exemplo.com">
          </div>

          <div class="campo">
            <span>Senha</span>
            <input id="senha_input" type="password" placeholder="********">
          </div>

          <button class="botao" type="button">Cadastrar</button>
        </div>

        <p class="login-footer">
          Já tem uma conta? <a href="../../login/index/index.html">Faça login</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
